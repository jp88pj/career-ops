# Career-Ops — Canonical States
# Source of truth for career-ops (writer) and dashboard (reader).
# Both systems MUST use these exact states.
#
# Rule: The status field in applications.md must contain EXACTLY
# one of these values (case-insensitive). No markdown bold (**),
# no dates, no extra text. Dates go in the date column.
#
# `terminal: true` marks a state with no further one-way lifecycle order
# among the other terminal states (they still supersede any non-terminal,
# earlier-stage state). States without a `terminal` key are treated as
# non-terminal and ordered by their position in this list. Consumed by
# tracker-sync-check.mjs's compareLifecycle() (issue #1504) so a new state
# added here can't silently fall through as "unrecognized."

states:
  - id: evaluated
    label: Evaluated
    aliases: [evaluada, condicional, hold, evaluar, verificar, değerlendirildi, degerlendirildi]
    description: Offer evaluated with report, pending decision
    dashboard_group: evaluated

  - id: applied
    label: Applied
    aliases: [aplicado, enviada, aplicada, sent, başvuruldu, basvuruldu]
    description: Application submitted
    dashboard_group: applied

  - id: responded
    label: Responded
    aliases: [respondido, "yanıt verildi", yanıt_verildi, "yanit verildi", yanit_verildi]
    description: Company has responded (not yet interview)
    dashboard_group: responded

  - id: assessment
    label: Assessment
    aliases: [screening, "online assessment", online_assessment, "online screening"]
    description: Online assessment or asynchronous screening stage
    dashboard_group: assessment

  - id: interview
    label: Interview
    aliases: [entrevista, mülakat, mulakat]
    description: Active interview process
    dashboard_group: interview

  - id: offer
    label: Offer
    aliases: [oferta, teklif]
    description: Offer received
    dashboard_group: offer
    terminal: true

  - id: rejected
    label: Rejected
    aliases: [rechazado, rechazada, reddedildi]
    description: Rejected by company
    dashboard_group: rejected
    terminal: true

  # ADDED 2026-10-17, user-approved. See modes/_custom.md -> "Lapsed vs Rejected".
  #
  # WHY IT EXISTS: the Applied bucket could not empty. The user does not send
  # follow-ups (standing preference), and until this state there was no way to
  # record "submitted, no response, window elapsed, closed without action" —
  # so those rows stayed Applied forever. Measured 2026-10-17: of 36 Applied
  # rows, only 9 were under 14 days old, 22 were 15-30 days, and 5 were past
  # 30 days with no correspondence of any kind. "36 Applied" overstated live
  # prospects by roughly 4x.
  #
  # WHY IT IS NOT "Rejected": Rejected implies a DECISION was made by the
  # employer. Measured across the 15 real rejections there were three distinct
  # endings -- an explicit rejection email (10), "we've filled the role"
  # (1), and a volume acknowledgement followed by silence where the employer
  # says in advance it will only contact the best-matched candidates and then
  # contacts none (IXL, #14). Only the first two are decisions. The third is a
  # non-event, and calling it Rejected would put a number in the tracker that
  # the evidence does not support.
  #
  # Keep Rejected for evidence of a decision. Use Lapsed for its absence.
  #
  # RE-APPLIED 2026-10-19: the v1.37.0 update overwrote this file and dropped
  # this state entirely -- see data/system-invariants.ps1, which now guards it.
  - id: lapsed
    label: Lapsed
    aliases: [lapsed, caducado, caducada, expired, closed, silente, unanswered, "sessiz", zaman asimina ugradi]
    description: Application window elapsed with no employer response and no follow-up sent
    dashboard_group: rejected
    terminal: true

  - id: discarded
    label: Discarded
    aliases: [descartado, descartada, cerrada, cancelada, "iptal edildi", iptal_edildi, "ıptal edildi", ıptal_edildi]
    description: Discarded by candidate or offer closed
    dashboard_group: discarded
    terminal: true

  - id: skip
    label: SKIP
    aliases: [no_aplicar, no aplicar, skip, monitor, geo blocker, geo_blocker, "uygun değil", uygun_değil, "uygun degil", uygun_degil]
    description: Doesn't fit, don't apply
    dashboard_group: skip
    terminal: true

  - id: hired
    label: Hired
    aliases: [contratado, contratada, hired, accepted, accept, "kabul edildi", kabul_edildi, "işe alındı", "ise alindi", "işe alindi"]
    description: Offer accepted, job landed!
    dashboard_group: hired
    terminal: true
